<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<text x="600" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#e2e8f0">File Extractor · architecture</text>
<path d="M240,190 L336,190" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="288" y="174" text-anchor="middle" font-size="13" fill="#94a3b8">pick template + upload</text>
<path d="M520,190 L616,190" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
