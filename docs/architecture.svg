<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">File Extractor architecture</title><desc id="d">A user uploads a file in the React UI, which calls the Express API. The API loads a template from MongoDB, parses the file, and sends it to an AI agent that returns extracted fields to the UI.</desc>
